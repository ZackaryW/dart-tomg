# Build input only. This file is outside lib/ and is never declared as a
# runtime asset; tomgen embeds its values in generated Dart constants.

[__tomg]
obfuscate = ["url"]

[us-east]
id = "us-east"
name = "US East"
url = "https://api.us-east.example.com"
environment = "$TOMG_EXAMPLE_ENV_UNSET_7F3A9C2D=production"

[eu-west]
id = "eu-west"
name = "EU West"
url = "https://api.eu-west.example.com"
environment = "$TOMG_EXAMPLE_ENV_UNSET_7F3A9C2D=production"
enabled = false

[staging]
id = "staging"
name = "Staging"
url = "https://staging.example.com"
environment = "$TOMG_EXAMPLE_ENV_UNSET_7F3A9C2D=staging"
visible = false
