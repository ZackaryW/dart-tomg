name: tomgen
description: >-
  TOML-first CLI and build_runner generator for dart-tomg: generates typed
  model libraries and compiles build-input TOML into const Dart registries,
  including optional field obfuscation. A dev_dependency in consuming packages.
version: 0.1.0
repository: https://github.com/ZackaryW/dart-tomg/tree/main/tomgen
issue_tracker: https://github.com/ZackaryW/dart-tomg/issues
topics:
  - toml
  - code-generation
  - build-runner
  - configuration

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  args: ^2.7.0
  analyzer: ^14.0.0
  build: ^4.0.0
  crypto: ^3.0.7
  dart_style: ^3.1.13
  path: ^1.9.1
  source_gen: ^4.3.0
  toml: ^0.18.0
  tomg: ^0.1.0
  yaml: ^3.1.3

executables:
  tomgen: tomgen

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.0.0
  test: ^1.25.6
